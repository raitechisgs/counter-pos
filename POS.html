<style>
[hidden]{display:none!important}
html,body{margin:0}
/* Layout: sticky top bar with tabs; Sell = catalog grid + order panel; other tabs = full-width tables and report cards. */
:root{
  --bg:#f1f4f1; --surface:#ffffff; --surface2:#e8ede9; --fg:#18231f; --muted:#5a6a62; --line:#d3dbd5;

  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --hh:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201d; --surface2:#222c28; --fg:#e6ede9; --muted:#97a69d; --line:#2c3833;
  --accent:#3fc4a6; --accent-fg:#04201a; --accent-soft:#17372f;
  --good:#58c47a; --good-soft:#163323; --warn:#e3a444; --warn-soft:#3a2c10; --bad:#f07a70; --bad-soft:#40201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --surface2:#222c28; --fg:#e6ede9; --muted:#97a69d; --line:#2c3833;
  --accent:#3fc4a6; --accent-fg:#04201a; --accent-soft:#17372f;
  --good:#58c47a; --good-soft:#163323; --warn:#e3a444; --warn-soft:#3a2c10; --bad:#f07a70; --bad-soft:#40201d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.01em;text-wrap:balance}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1480px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;gap:14px;min-height:var(--hh);flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--font-head);font-weight:700;font-size:17px;white-space:nowrap}

.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}

.nav button{border:0;background:transparent;padding:9px 13px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}

.right{display:flex;gap:10px;align-items:center}

select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],input[type=email],input:not([type]),textarea{

.btn.big{padding:15px 18px;font-size:17px;font-family:var(--font-head)}

main.inner{padding-block:16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.lines{overflow-y:auto;flex:1;min-height:120px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

tbody tr.click:hover td{background:var(--surface2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}

.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin-bottom:14px}
.card h3{margin-bottom:12px}
svg.chart{width:100%;height:auto;display:block}
svg .ax{fill:var(--muted);font:11px var(--font-body)}
svg .gl{stroke:var(--line);stroke-width:1}

.share{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:6px 10px;align-items:center}

.kv{display:flex;flex-direction:column}

.kv .tr.b{font-weight:700}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:rgba(10,16,14,.55)}
.dialog{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(100%,460px);max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dialog.wide{width:min(100%,640px)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.paper{background:#fbfbf8;color:#1b1b1b;border:1px dashed #b9b9b0;border-radius:6px;padding:14px;font:12px/1.4 var(--font-mono);white-space:pre;overflow-x:auto;margin:0}
.pay-total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-head)}

.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.methods button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:600}
.methods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.paysum{padding:10px 12px;border-radius:8px;background:var(--surface2);font-weight:600;display:flex;justify-content:space-between}
.paysum.ok{background:var(--good-soft);color:var(--good)} .paysum.short{background:var(--warn-soft);color:var(--warn)}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:200;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-bottom:12px}
.flag-low{color:var(--warn);font-weight:700} .flag-out{color:var(--bad);font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}


.auth{max-width:400px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.auth .err{color:var(--bad);font-weight:600;min-height:18px}
@media (max-width:900px){
  .sell{grid-template-columns:minmax(0,1fr)}
  .cart{display:none}
  .sell.cart-open .cart{display:flex;position:fixed;inset:0;z-index:70;max-height:none;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart-close{display:inline-flex}
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-family:var(--font-head);font-size:16px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .sell{padding-bottom:64px}
  .right .pill.hide-s{display:none}
}
html.has-bg body{background-color:var(--bg);background-image:linear-gradient(color-mix(in srgb,var(--bg) var(--bg-dim),transparent),color-mix(in srgb,var(--bg) var(--bg-dim),transparent)),var(--bg-img);background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat}

@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important}

  body>#printArea{display:block!important;color:#000;background:#fff;white-space:pre;font-family:'Courier New',Courier,monospace;line-height:1.25;margin:0;padding:1mm 2mm;overflow:visible}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const DAY=864e5;
const startOfDay=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const pad2=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const fmtTime=ts=>new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmtDate=ts=>new Date(ts).toLocaleDateString([],{month:'short',day:'numeric'});
const fmtDT=ts=>fmtDate(ts)+', '+fmtTime(ts);
const parseDay=v=>v?new Date(v+'T00:00:00').getTime():NaN;
function money(n){const s=db.settings;const v=Math.abs(r2(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0&&r2(n)!==0?'-':'')+s.currency+v}
const compact=n=>{const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(a>=1e3)return (n/1e3).toFixed(a%1e3?1:0).replace(/\.0$/,'')+'k';return String(Math.round(n))};
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n};
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);

/* ============================ data ============================ */
const LS_KEY='counter_pos_v1';
let storageOk=true;
const DEF_SETTINGS={store:'Corner Cup Coffee',address:'123 Main Street',phone:'',currency:'₱',taxName:'VAT',taxRate:12,taxInclusive:true,footer:'Thank you! See you again.',loyaltyEvery:100,pointValue:1,receiptNo:1001,paper:'80',autoPrint:false,bgImage:'',bgDim:55,bgPanel:88,cashier:null,demo:false,lockMinutes:10};

function normalize(d){const b=blankDb();d.settings={...b.settings,...(d.settings||{})};for(const k of ['staff','categories','products','customers','sales','held','shifts','stockLog'])if(!Array.isArray(d[k]))d[k]=b[k];if(!d.staff.length)d.staff=b.staff;if(!d.settings.cashier||!d.staff.find(s=>s.id===d.settings.cashier))d.settings.cashier=d.staff[0].id;return d}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demoData(){

    ['Cappuccino','Coffee',140,45,0,0,0,dm],['Flat White','Coffee',150,50,0,0,0,dm],['Caramel Macchiato','Coffee',165,55,0,0,0,dm],
    ['Spanish Latte','Coffee',160,52,0,0,0,dm],['Iced Americano','Coffee',120,32,0,0,0,dm],['Iced Latte','Coffee',150,48,0,0,0,dm],
    ['Cold Brew','Coffee',150,40,0,0,0,dm.slice(0,2)],['Mocha','Coffee',160,55,0,0,0,dm],
    ['Matcha Latte','Non-Coffee',160,60,0,0,0,dm.slice(0,2)],['Hot Chocolate','Non-Coffee',130,40,0,0,0,dm.slice(0,1)],['Chai Latte','Non-Coffee',140,45,0,0,0,dm.slice(0,2)],['Fruit Tea','Non-Coffee',120,30,0,0,0,dm.slice(0,1)],
    ['Butter Croissant','Pastries',95,38,1,22,8,[]],['Chocolate Muffin','Pastries',85,32,1,6,8,[]],['Blueberry Cheesecake','Pastries',165,70,1,9,4,[]],
    ['Banana Bread','Pastries',80,28,1,14,6,[]],['Cinnamon Roll','Pastries',110,42,1,3,6,[]],
    ['Ham & Cheese Sandwich','Food',160,70,1,12,5,[]],['Chicken Pesto Panini','Food',195,85,1,10,5,[]],['Tuna Melt','Food',175,75,1,0,5,[]],
    ['House Blend Beans 250g','Retail',420,230,1,18,6,[]],['Reusable Tumbler','Retail',550,300,1,7,4,[]],['Drip Bags (5)','Retail',180,90,1,25,8,[]]
  ];
  defs.forEach((x,i)=>d.products.push({id:'p'+(i+1),name:x[0],cat:x[1],price:x[2],cost:x[3],track:!!x[4],stock:x[5],low:x[6]||5,sku:'',active:true,mods:x[7].map(m=>({name:m[0],price:m[1]}))}));
  ['Lia Santos|0917 555 0101|120','Marco Reyes|0918 555 0144|45','Bea Cruz|0920 555 0190|310','Dan Villanueva|0905 555 0133|15','Kim Dela Cruz|0927 555 0166|80','Joy Ramos||0'].forEach((c,i)=>{const p=c.split('|');d.customers.push({id:'c'+(i+1),name:p[0],phone:p[1],email:'',points:+p[2],note:''})});
  const wcat={Coffee:5,'Non-Coffee':2,Pastries:2.5,Food:1.2,Retail:.35};
  const prodsW=d.products.map(p=>({p,w:wcat[p.cat]*(p.track&&p.stock===0?0.2:1)}));
  const totW=sum(prodsW,x=>x.w);
  const pickProd=()=>{let r=rnd()*totW;for(const x of prodsW){r-=x.w;if(r<=0)return x.p}return prodsW[0].p};
  const hw=[[7,6],[8,10],[9,9],[10,6],[11,5],[12,6],[13,6],[14,7],[15,6],[16,5],[17,4],[18,3],[19,2],[20,1]];
  const totH=sum(hw,x=>x[1]);
  const pickHour=()=>{let r=rnd()*totH;for(const x of hw){r-=x[1];if(r<=0)return x[0]}return 9};
  const now=Date.now(), today=startOfDay(now);
  const sales=[];
  for(let off=20;off>=0;off--){
    const dayDate=new Date(today);dayDate.setDate(dayDate.getDate()-off);
    const day0=dayDate.getTime();
    const dow=dayDate.getDay();
    const n=Math.round(26+(dow===0||dow===6?12:0)+rnd()*14);
    const shiftId='sh'+off;
    for(let k=0;k<n;k++){
      const ts=day0+pickHour()*36e5+Math.floor(rnd()*60)*6e4+Math.floor(rnd()*60)*1e3;
      if(ts>now)continue;
      const cnt=1+Math.floor(rnd()*3)+(rnd()<.3?1:0);
      const items=[];
      for(let j=0;j<cnt;j++){
        const p=pickProd();let mods=[],price=p.price;
        if(p.mods.length&&rnd()<.38){const m=p.mods[Math.floor(rnd()*p.mods.length)];mods=[m.name];price+=m.price}
        const qty=rnd()<.15?2:1;
        const ex=items.find(i=>i.pid===p.id&&i.mods.join()===mods.join());
        if(ex)ex.qty+=qty;else items.push({pid:p.id,name:p.name,cat:p.cat,qty,price,cost:p.cost,mods,note:''});
      }
      let disc=null;const dr=rnd();
      if(dr<.08)disc={kind:'pct',value:10,label:'Promo 10%'};else if(dr<.11)disc={kind:'pct',value:20,label:'Senior/PWD 20%'};
      const t=totalsFor(items,disc,0,d.settings);
      const pr=rnd();let payments,change=0;
      if(pr<.5){const tend=Math.ceil(t.total/ (t.total>300?100:50))*(t.total>300?100:50);const given=rnd()<.3?tend:Math.ceil(t.total/50)*50;payments=[{method:'Cash',amount:given}];change=r2(given-t.total)}
      else if(pr<.78)payments=[{method:'Card',amount:t.total}];else payments=[{method:'E-wallet',amount:t.total}];
      const cu=rnd()<.2?d.customers[Math.floor(rnd()*d.customers.length)]:null;
      const cashier=ts-day0<12*36e5?'u1':ts-day0<17*36e5?'u2':'u3';
      sales.push({id:uid(),no:0,ts,shiftId,cashier:d.staff.find(s=>s.id===cashier).name,cashierId:cashier,type:rnd()<.55?'Dine-in':rnd()<.85?'Takeout':'Delivery',ref:'',items,subtotal:t.subtotal,discount:t.disc,discountLabel:t.discLabel,loyalty:0,tax:t.tax,total:t.total,payments,paid:r2(sum(payments,p=>p.amount)),change,customerId:cu?cu.id:null,pointsUsed:0,pointsEarned:0,status:'paid'});
    }
  }
  sales.sort((a,b)=>a.ts-b.ts);
  let no=d.settings.receiptNo;
  sales.forEach(s=>{s.no=no++});
  d.settings.receiptNo=no;
  /* a few refunded card sales */
  let rf=0;
  sales.forEach(s=>{if(rf<5&&s.payments[0].method==='Card'&&s.ts<today&&rnd()<.04){s.status='refunded';s.refund={ts:s.ts+36e5,reason:'Wrong order',by:s.cashier};rf++}});
  d.sales=sales;
  for(let off=20;off>=0;off--){
    const day0=today-off*DAY;
    const sh={id:'sh'+off,openTs:off===0?Math.min(day0+6.5*36e5,now-6e4):day0+6.5*36e5,closeTs:null,cashier:off===0?'Mara':['Mara','Jon','Ana'][off%3],openingCash:2000,entries:[],counted:null,expected:null,variance:null};
    d.shifts.push(sh);
  }
  d.shifts.forEach(sh=>{
    if(sh.id==='sh0')return;
    sh.closeTs=sh.openTs+15*36e5;
    d.sales.filter(s=>s.shiftId===sh.id&&s.status==='refunded').forEach(s=>{const c=cashNet(s);if(c>0)sh.entries.push({ts:s.refund.ts,type:'refund',amount:c,reason:'Refund #'+s.no})});
    if(+sh.id.slice(2)%4===0)sh.entries.push({ts:sh.openTs+5*36e5,type:'out',amount:350,reason:'Milk delivery'});
    const st=shiftStats(sh,d);
    const vv=[0,0,0,0,-20,-50,10,-5,0][Math.floor(rnd()*9)];
    sh.expected=st.expected;sh.counted=r2(st.expected+vv);sh.variance=vv;
  });
  d.shifts.reverse();
  return d;
}

/* ============================ calculations ============================ */
function totalsFor(items,disc,loyalty,s){
  const subtotal=r2(sum(items,i=>i.price*i.qty));
  let d=0,label='';
  if(disc&&disc.value>0){d=disc.kind==='pct'?r2(subtotal*Math.min(100,disc.value)/100):Math.min(subtotal,r2(disc.value));label=disc.label||(disc.kind==='pct'?disc.value+'% off':'Discount')}
  const lo=Math.max(0,Math.min(loyalty||0,r2(subtotal-d)));
  const after=r2(subtotal-d-lo);
  const rate=(s.taxRate||0)/100;
  let tax,total;
  if(s.taxInclusive){tax=r2(after-after/(1+rate));total=after}else{tax=r2(after*rate);total=r2(after+tax)}
  return {subtotal,disc:d,discLabel:label,loyalty:lo,after,tax,total,net:r2(total-tax),qty:sum(items,i=>i.qty)};
}
function cartTotals(){
  const cu=cust(cart.customerId);let lo=0,pts=0;
  if(cu&&cart.redeem>0){const base=totalsFor(cart.items,cart.disc,0,db.settings);pts=Math.max(0,Math.min(cart.redeem,cu.points,Math.floor(base.after/(db.settings.pointValue||1))));lo=r2(pts*db.settings.pointValue)}
  const t=totalsFor(cart.items,cart.disc,lo,db.settings);t.pts=pts;return t;
}
function cashNet(s){return r2(Math.max(0,sum(s.payments.filter(p=>p.method==='Cash'),p=>p.amount)-(s.change||0)))}
function methodTotals(s){const m={};s.payments.forEach(p=>{m[p.method]=(m[p.method]||0)+p.amount});if(m.Cash!=null)m.Cash=r2(m.Cash-(s.change||0));return m}
function shiftStats(sh,d){
  d=d||db;
  const all=d.sales.filter(s=>s.shiftId===sh.id), paid=all.filter(s=>s.status==='paid');
  const cashReceived=r2(sum(all,cashNet));
  const ent=(t)=>r2(sum(sh.entries.filter(e=>e.type===t),e=>e.amount));
  const pin=ent('in'),pout=ent('out'),refunds=ent('refund');
  const methods={};paid.forEach(s=>{const m=methodTotals(s);for(const k in m)methods[k]=r2((methods[k]||0)+m[k])});
  return {all,paid,cashReceived,pin,pout,refunds,methods,expected:r2(sh.openingCash+cashReceived+pin-pout-refunds),
    gross:r2(sum(paid,s=>s.subtotal)),disc:r2(sum(paid,s=>s.discount+s.loyalty)),tax:r2(sum(paid,s=>s.tax)),total:r2(sum(paid,s=>s.total)),
    refundedCount:all.filter(s=>s.status==='refunded').length,refundedTotal:r2(sum(all.filter(s=>s.status==='refunded'),s=>s.total))};
}

/* ---- payment ---- */
function payRemaining(){const t=cartTotals();return r2(t.total-sum(pay.payments,p=>p.amount))}
function charge(){
  if(!cart.items.length)return;
  if(!openShift()){modal(`<div class="dialog-head"><h2>Open a shift first</h2></div><p class="muted" style="margin:0">Payments are recorded against a cash drawer shift. Start one with your opening cash.</p><div class="actions"><button class="btn" data-act="closeModal">Not now</button><button class="btn primary" data-act="goShift">Open shift</button></div>`);return}
  pay={payments:[],method:'Cash'};
  const t=cartTotals();
  modal(`<div class="dialog-head"><h2>Payment</h2><button class="btn sm" data-act="closeModal">Cancel</button></div>
    <div class="pay-total"><span class="muted">Amount due</span><strong class="num">${money(t.total)}</strong></div>
    <div id="payList"></div>
    <div class="methods" role="group" aria-label="Payment method">${['Cash','Card','E-wallet','Other'].map(m=>`<button data-act="payMethod" data-m="${m}" aria-pressed="${m==='Cash'}">${m}</button>`).join('')}</div>
    <label class="f">Amount<input id="payAmt" inputmode="decimal" data-in="payAmt" data-focus></label>
    <div class="quick" id="payQuick"></div>
    <div class="paysum" id="paySum"></div>
    <div class="actions"><button class="btn primary big" id="payGo" data-act="payGo" style="flex:1">Complete sale</button></div>`);
  setPayAmount();
}
function setPayAmount(){const rem=Math.max(0,payRemaining());const i=$('#payAmt');if(i){i.value=rem?rem.toFixed(2):'';}renderPayParts()}
function renderPayParts(){
  const rem=payRemaining();
  $('#payList').innerHTML=pay.payments.map((p,i)=>`<div class="listrow"><span>${esc(p.method)}</span><span class="row"><span class="num">${money(p.amount)}</span><button class="btn sm" data-act="removePay" data-i="${i}" aria-label="Remove payment">Remove</button></span></div>`).join('');
  const q=$('#payQuick');
  if(pay.method==='Cash'&&rem>0){
    const steps=[...new Set([rem,Math.ceil(rem/50)*50,Math.ceil(rem/100)*100,Math.ceil(rem/500)*500,Math.ceil(rem/1000)*1000].map(x=>r2(x)))].filter(x=>x>=rem).slice(0,5);
    q.innerHTML=steps.map((x,i)=>`<button class="btn sm" data-act="quickAmt" data-v="${x}">${i===0?'Exact ':''}${money(x)}</button>`).join('');
  }else q.innerHTML='';
  updatePayUI();
}
function updatePayUI(){
  const rem=payRemaining();const amt=num($('#payAmt').value);
  const sumEl=$('#paySum'),go=$('#payGo');
  const covers=amt+0.004>=rem&&rem>0;
  if(rem<=0){sumEl.className='paysum ok';sumEl.innerHTML='<span>Fully paid</span><span class="num">Change '+money(Math.max(0,-rem))+'</span>';go.textContent='Complete sale';go.disabled=false;return}
  if(pay.method==='Cash'&&covers&&amt>0){sumEl.className='paysum ok';sumEl.innerHTML='<span>Change due</span><span class="num">'+money(amt-rem)+'</span>';go.textContent='Complete sale';go.disabled=false}
  else if(covers){sumEl.className='paysum ok';sumEl.innerHTML='<span>Remaining</span><span class="num">'+money(rem)+'</span>';go.textContent='Complete sale';go.disabled=false}
  else if(amt>0){sumEl.className='paysum short';sumEl.innerHTML='<span>Still to pay after this</span><span class="num">'+money(rem-amt)+'</span>';go.textContent='Add '+money(amt)+' and continue';go.disabled=false}
  else{sumEl.className='paysum short';sumEl.innerHTML='<span>Remaining</span><span class="num">'+money(rem)+'</span>';go.textContent='Enter an amount';go.disabled=true}
}
function payGo(){
  let rem=payRemaining();
  if(rem>0){
    let amt=r2(num($('#payAmt').value));if(amt<=0)return;
    if(pay.method!=='Cash')amt=Math.min(amt,rem);
    pay.payments.push({method:pay.method,amount:amt});rem=payRemaining();
  }
  if(rem>0){setPayAmount();return}
  finalizeSale();
}
function finalizeSale(){
  const t=cartTotals(),s=db.settings,sh=openShift(),cu=cust(cart.customerId);
  const paid=r2(sum(pay.payments,p=>p.amount)),change=r2(Math.max(0,paid-t.total));
  const earned=cu&&s.loyaltyEvery>0?Math.floor(t.total/s.loyaltyEvery):0;
  const sale={id:uid(),no:s.receiptNo++,ts:Date.now(),shiftId:sh.id,cashier:cashierName(),cashierId:s.cashier,type:cart.type,ref:cart.ref.trim(),
    items:cart.items.map(i=>({pid:i.pid,name:i.name,cat:i.cat,qty:i.qty,price:i.price,cost:i.cost,mods:[...i.mods],note:i.note})),
    subtotal:t.subtotal,discount:t.disc,discountLabel:t.discLabel,loyalty:t.loyalty,tax:t.tax,total:t.total,payments:pay.payments.map(p=>({...p})),paid,change,
    customerId:cu?cu.id:null,pointsUsed:t.pts,pointsEarned:earned,status:'paid'};
  sale.items.forEach(i=>{const p=prod(i.pid);if(p&&p.track)p.stock=Math.max(0,p.stock-i.qty)});
  if(cu){cu.points=Math.max(0,cu.points-t.pts+earned)}
  db.sales.push(sale);
  cart=newCart();pay=null;ui.cartOpen=false;save();
  render();
  receiptModal(sale.id,true);
  if(db.settings.autoPrint)setTimeout(()=>printText(receiptText(sale)),250);
}

/* ---- receipt ---- */
const paperChars=()=>db.settings.paper==='58'?32:42;
function printText(text){
  const a=$('#printArea'),narrow=db.settings.paper==='58';
  const chars=narrow?32:42,printMm=narrow?48:72;
  a.style.width=(printMm+4)+'mm';
  a.style.fontSize=(printMm*3.7795/(chars*0.6)).toFixed(2)+'px';
  a.textContent=text+'\n\n\n\n';
  try{window.print()}catch(e){toast('Printing is not available in this browser')}
}
function receiptText(sale){
  const s=db.settings,W=paperChars();
  const ctr=t=>' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t;
  const lr=(l,r)=>{const sp=W-l.length-r.length;return sp>0?l+' '.repeat(sp)+r:l+' '+r};
  const hr='-'.repeat(W);
  const L=[];
  L.push(ctr(s.store));if(s.address)L.push(ctr(s.address));if(s.phone)L.push(ctr(s.phone));
  L.push(hr);
  L.push(lr('Receipt #'+sale.no,fmtDT(sale.ts)));
  L.push(lr('Cashier: '+sale.cashier,sale.type+(sale.ref?' · '+sale.ref:'')));
  const cu=cust(sale.customerId);if(cu)L.push('Customer: '+cu.name);
  if(sale.status==='refunded')L.push(ctr('*** REFUNDED ***'));
  L.push(hr);
  sale.items.forEach(i=>{
    L.push(lr(i.qty+' x '+i.name,money(i.price*i.qty)));
    if(i.mods.length)L.push('    '+i.mods.join(', '));
    if(i.note)L.push('    Note: '+i.note);
  });
  L.push(hr);
  L.push(lr('Subtotal',money(sale.subtotal)));
  if(sale.discount>0)L.push(lr(sale.discountLabel||'Discount','-'+money(sale.discount)));
  if(sale.loyalty>0)L.push(lr('Points used','-'+money(sale.loyalty)));
  if(s.taxRate>0||sale.tax>0)L.push(lr(s.taxName+(s.taxInclusive?' (incl.)':''),money(sale.tax)));
  L.push(lr('TOTAL',money(sale.total)));
  L.push(hr);
  sale.payments.forEach(p=>L.push(lr(p.method,money(p.amount))));
  if(sale.change>0)L.push(lr('Change',money(sale.change)));
  if(cu&&(sale.pointsEarned||sale.pointsUsed)){L.push(hr);L.push('Points earned: '+sale.pointsEarned+(sale.pointsUsed?'  used: '+sale.pointsUsed:''));L.push('Balance: '+cu.points+' pts')}
  if(s.footer){L.push(hr);L.push(ctr(s.footer))}
  return L.join('\n');
}
function receiptModal(id,justPaid){
  const sale=db.sales.find(s=>s.id===id);if(!sale)return;
  const t=receiptText(sale);
  modal(`<div class="dialog-head"><h2>${justPaid?'Sale complete':'Receipt #'+sale.no}</h2>${sale.status==='refunded'?'<span class="pill bad">Refunded</span>':''}</div>
    <pre class="paper" id="rcpt">${esc(t)}</pre>
    <div class="actions">
      ${!justPaid&&sale.status==='paid'&&isAdmin()?`<button class="btn danger" data-act="refund" data-id="${sale.id}">Refund</button>`:''}
      ${!justPaid&&isAdmin()?`<button class="btn danger" data-act="deleteSale" data-id="${sale.id}">Delete order</button>`:''}
      <button class="btn" data-act="copyReceipt" data-id="${sale.id}">Copy</button>
      <button class="btn" data-act="printReceipt" data-id="${sale.id}">Print</button>
      <button class="btn" data-act="saveReceipt" data-id="${sale.id}">Save .txt</button>
      <button class="btn primary" data-act="closeModal" data-focus>${justPaid?'New sale':'Close'}</button>
    </div>`,{wide:false});
}
function refundModal(id){
  const sale=db.sales.find(s=>s.id===id);if(!sale||sale.status!=='paid')return;
  modal(`<div class="dialog-head"><h2>Refund #${sale.no}</h2></div>
    <p class="muted" style="margin:0">Refund ${money(sale.total)}. Tracked stock goes back on the shelf and loyalty points are reversed.${cashNet(sale)>0&&openShift()?' The cash portion is taken out of the open drawer.':''}</p>
    <label class="f">Reason<select id="rreason">${['Wrong order','Quality issue','Customer changed mind','Cashier error','Other'].map(r=>`<option>${r}</option>`).join('')}</select></label>
    <div class="actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="confirmRefund" data-id="${sale.id}">Refund ${money(sale.total)}</button></div>`);
}
function deleteSaleModal(id){
  if(!isAdmin())return;
  const sale=db.sales.find(s=>s.id===id);if(!sale)return;
  modal(`<div class="dialog-head"><h2>Delete order #${sale.no}?</h2></div>
    <p style="margin:0">This removes the order for good. It will disappear from Orders, reports and the cash drawer totals. This cannot be undone, so download a backup first if you are unsure.</p>
    <div class="paysum"><span>#${sale.no} · ${fmtDT(sale.ts)}</span><span class="num">${money(sale.total)}</span></div>
    ${sale.status==='paid'?`<label class="chk"><input type="checkbox" id="del-restore"> Also put the items back in stock and reverse loyalty points</label>`:'<p class="muted small" style="margin:0">This order was already refunded, so stock and points were handled then.</p>'}
    <div class="actions"><button class="btn" data-act="closeModal" data-focus>Keep order</button><button class="btn danger" data-act="confirmDeleteSale" data-id="${sale.id}">Delete order</button></div>`);
}
function doDeleteSale(id){
  if(!isAdmin())return;
  const i=db.sales.findIndex(s=>s.id===id);if(i<0)return;
  const sale=db.sales[i],box=$('#del-restore'),restore=box&&box.checked&&sale.status==='paid';
  if(restore){
    sale.items.forEach(it=>{const p=prod(it.pid);if(p&&p.track){p.stock+=it.qty;db.stockLog.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,delta:it.qty,reason:'Deleted order #'+sale.no,by:cashierName()})}});
    const cu=cust(sale.customerId);if(cu)cu.points=Math.max(0,cu.points-sale.pointsEarned+sale.pointsUsed);
  }
  db.sales.splice(i,1);
  save();closeModal();render();toast('Order #'+sale.no+' deleted');
}
function doRefund(id,reason){
  const sale=db.sales.find(s=>s.id===id);if(!sale||sale.status!=='paid')return;
  sale.status='refunded';sale.refund={ts:Date.now(),reason,by:cashierName()};
  sale.items.forEach(i=>{const p=prod(i.pid);if(p&&p.track){p.stock+=i.qty;db.stockLog.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,delta:i.qty,reason:'Refund #'+sale.no,by:cashierName()})}});
  const cu=cust(sale.customerId);if(cu)cu.points=Math.max(0,cu.points-sale.pointsEarned+sale.pointsUsed);
  const sh=openShift(),c=cashNet(sale);
  if(sh&&c>0)sh.entries.push({ts:Date.now(),type:'refund',amount:c,reason:'Refund #'+sale.no});
  save();closeModal();render();toast('Sale #'+sale.no+' refunded');
}

  </tbody></table></div>${list.length>shown.length?`<p class="muted small">Showing the latest ${shown.length}. Narrow the date range to see more.</p>`:''}`;

function parseMods(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[\s|:]*\+?\s*(-?\d+(?:\.\d+)?)\s*$/);return m&&m[1]?{name:m[1].trim(),price:+m[2]}:{name:l,price:0}})}
function saveProduct(id){
  const name=$('#pf-name').value.trim(),price=num($('#pf-price').value);
  if(!name){toast('Give the item a name');return}
  if(!(price>=0)||$('#pf-price').value.trim()===''){toast('Enter a price');return}
  const cat=$('#pf-cat').value.trim()||'General';
  if(!db.categories.includes(cat))db.categories.push(cat);
  const data={name,cat,price,cost:num($('#pf-cost').value),sku:$('#pf-sku').value.trim(),track:$('#pf-track').checked,stock:Math.round(num($('#pf-stock').value)),low:Math.round(num($('#pf-low').value)),active:$('#pf-active').checked,mods:parseMods($('#pf-mods').value)};
  if(id){const p=prod(id);const delta=data.stock-p.stock;Object.assign(p,data);if(p.track&&delta!==0)db.stockLog.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,delta,reason:'Edited item',by:cashierName()})}
  else db.products.push({id:uid(),...data});
  save();closeModal();render();toast('Item saved');
}
function adjustModal(id){
  const p=prod(id);
  modal(`<div class="dialog-head"><h2>Adjust stock</h2></div><p style="margin:0"><strong>${esc(p.name)}</strong><br><span class="muted">On hand now: ${p.stock}</span></p>

/* ============================ REPORTS ============================ */
function reportRange(){
  const t=startOfDay(Date.now()),k=ui.rrange;
  if(k==='today')return[t,t+DAY];if(k==='yesterday')return[t-DAY,t];if(k==='7d')return[t-6*DAY,t+DAY];if(k==='30d')return[t-29*DAY,t+DAY];
  if(k==='month'){const d=new Date(t);d.setDate(1);return[d.getTime(),t+DAY]}
  const a=parseDay(ui.rfrom),b=parseDay(ui.rto);
  if(isNaN(a)||isNaN(b))return[t-6*DAY,t+DAY];
  return[Math.min(a,b),Math.max(a,b)+DAY];
}
function niceTop(m){const e=Math.pow(10,Math.floor(Math.log10(m)));const f=m/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function barChart(data,label){
  const W=640,H=200,pl=44,pr=6,pt=10,pb=24,n=data.length;
  const max=Math.max(...data.map(d=>d.v),1),top=niceTop(max);
  const iw=W-pl-pr,ih=H-pt-pb,slot=iw/n,bw=Math.max(2,Math.min(slot*.72,34));
  let g='';
  for(let i=0;i<=4;i++){const v=top*i/4,y=pt+ih-ih*i/4;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+4}" text-anchor="end">${compact(v)}</text>`}
  const every=Math.ceil(n/(n>16?10:n));
  data.forEach((d,i)=>{const h=ih*d.v/top,x=pl+slot*i+(slot-bw)/2,y=pt+ih-h;
    g+=`<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2"><title>${esc(d.l)}: ${money(d.v)}</title></rect>`;
    if(i%every===0)g+=`<text class="ax" x="${(pl+slot*i+slot/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(d.l)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function shareList(items,fmt){
  fmt=fmt||money;const tot=sum(items,i=>i.v)||1;
  if(!items.length)return '<div class="empty">No data in this period.</div>';
  return `<div class="share num">${items.map(i=>`<span>${esc(i.l)}</span><span class="track"><span class="fill" style="display:block;width:${Math.max(1.5,i.v/tot*100).toFixed(1)}%"></span></span><span>${fmt(i.v)} <span class="muted small">${Math.round(i.v/tot*100)}%</span></span>`).join('')}</div>`;
}
function reportData(){
  const [a,b]=reportRange();
  const inR=db.sales.filter(s=>s.ts>=a&&s.ts<b);
  const rows=inR.filter(s=>s.status==='paid'),refunds=inR.filter(s=>s.status==='refunded');
  const gross=sum(rows,s=>s.subtotal),disc=sum(rows,s=>s.discount+s.loyalty),tax=sum(rows,s=>s.tax),total=sum(rows,s=>s.total);
  const net=r2(total-tax),cogs=sum(rows,s=>sum(s.items,i=>i.cost*i.qty)),items=sum(rows,s=>sum(s.items,i=>i.qty));
  return {a,b,rows,refunds,gross,disc,tax,total,net,cogs,profit:r2(net-cogs),items,n:rows.length};
}
function groupSum(rows,keyFn,valFn){const m={};rows.forEach(r=>{const k=keyFn(r);m[k]=(m[k]||0)+valFn(r)});return Object.entries(m).map(([l,v])=>({l,v:r2(v)})).sort((x,y)=>y.v-x.v)}
function viewReports(){

    const first=byH.findIndex(x=>x.v>0),last=byH.map(x=>x.v>0).lastIndexOf(true);
    const sl=first<0?byH.slice(6,20):byH.slice(Math.max(0,Math.min(first,6)),Math.max(last+1,20));
    trendTitle='Net sales by hour';trend=barChart(sl.map(x=>({l:x.l,v:r2(x.v)})),trendTitle);
  }else{
    const map={};R.rows.forEach(r=>{const k=dayKey(r.ts);map[k]=(map[k]||0)+r.total-r.tax});
    const arr=[];const d=new Date(R.a);let guard=0;while(d.getTime()<R.b&&guard++<120){const k=dayKey(d.getTime());arr.push({l:days>14?String(d.getDate()):d.toLocaleDateString([],{weekday:'short',day:'numeric'}),v:r2(map[k]||0)});d.setDate(d.getDate()+1)}
    trendTitle='Net sales by day';trend=barChart(arr,trendTitle);

  <div class="kpis">

    ${kp('Orders',R.n,R.n?'Avg '+money(R.total/R.n)+' per order':'')}
    ${kp('Items sold',R.items,R.n?(R.items/R.n).toFixed(1)+' per order':'')}
    ${kp('Gross profit',money(R.profit),R.net?Math.round(R.profit/R.net*100)+'% margin':'')}

const SHA_K=[],SHA_H0=[];
(function(){let n=2,c=0;while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(c<8)SHA_H0.push(Math.floor((Math.pow(n,.5)%1)*4294967296));SHA_K.push(Math.floor((Math.pow(n,1/3)%1)*4294967296));c++}n++}})();
function sha256(bytes){
  const l=bytes.length,bitLen=l*8,padLen=((l+9+63)>>6)<<6;
  const m=new Uint8Array(padLen);m.set(bytes);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(padLen-8,Math.floor(bitLen/4294967296));dv.setUint32(padLen-4,bitLen>>>0);
  const H=SHA_H0.slice(),w=new Array(64);
  for(let off=0;off<padLen;off+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
    for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],hh=H[7];
    for(let i=0;i<64;i++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));const ch=(e&f)^(~e&g);const t1=(hh+S1+ch+SHA_K[i]+w[i])|0;const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));const mj=(a&b)^(a&c)^(b&c);const t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+hh)|0;
  }
  const out=new Uint8Array(32),ov=new DataView(out.buffer);H.forEach((v,i)=>ov.setUint32(i*4,v>>>0));return out;
}
function hashPw(pw,salt){
  const p=new TextEncoder().encode(salt+':'+pw);let h=sha256(p);
  for(let i=0;i<20000;i++){const b=new Uint8Array(h.length+p.length);b.set(h);b.set(p,h.length);h=sha256(b)}
  return Array.from(h).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function newSalt(){const a=new Uint8Array(12);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<12;i++)a[i]=Math.floor(Math.random()*256);return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('')}

function doLogin(){
  const now=Date.now();
  if(now<lockUntil){authErr('Too many attempts. Wait '+Math.ceil((lockUntil-now)/1000)+' seconds.');return}
  const un=$('#lg-user').value.trim().toLowerCase(),pw=$('#lg-pass').value;
  const u=db.staff.find(x=>x.hash&&x.username===un);
  if(u&&hashPw(pw,u.salt)===u.hash){fails=0;ui.user=u.id;db.settings.cashier=u.id;ui.view='sell';save();resetIdle();render();return}
  fails++;
  if(fails>=5){lockUntil=now+30000;fails=0;authErr('Too many attempts. Try again in 30 seconds.')}else authErr('Wrong username or password.');
  $('#lg-pass').value='';$('#lg-pass').focus();
}

function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const max=1920,k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
      g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('bad image'))};
    im.src=url;
  });
}

document.addEventListener('click',e=>{

    case 'login':doLogin();break;

    case 'bgRemove':db.settings.bgImage='';save();render();toast('Background removed');break;

    case 'newUser':userModal(null);break;
    case 'resetPw':userModal(id);break;
    case 'saveUser':saveUser();break;
    case 'savePw':savePw(id);break;
    case 'delUser':if(ui.confirm!=='du'){confirmTwice('du','Tap again to remove',()=>{},el);break}ui.confirm=null;delUser(id);break;
    case 'nav':ui.view=el.dataset.v;ui.cartOpen=false;render();window.scrollTo(0,0);break;
    case 'closeModal':closeModal();break;
    case 'setCat':ui.cat=el.dataset.c;renderChips();renderGrid();break;
    case 'addProduct':addProduct(id);break;
    case 'addWithMods':{const p=prod(id);const mods=[...document.querySelectorAll('.modchk:checked')].map(c=>p.mods[+c.value]);const note=$('#modnote').value.trim();closeModal();addToCart(p,mods,note);break}
    case 'incLine':{const i=cart.items[+el.dataset.i],p=prod(i.pid);if(p&&p.track&&sum(cart.items.filter(x=>x.pid===i.pid),x=>x.qty)>=p.stock){toast('No more '+p.name+' in stock');break}i.qty++;renderGrid();renderCart();break}
    case 'decLine':{const i=cart.items[+el.dataset.i];i.qty--;if(i.qty<=0)cart.items.splice(+el.dataset.i,1);renderGrid();renderCart();break}
    case 'removeLine':cart.items.splice(+el.dataset.i,1);renderGrid();renderCart();break;
    case 'noteLine':{const i=cart.items[+el.dataset.i];modal(`<div class="dialog-head"><h2>Note for ${esc(i.name)}</h2></div><input id="linenote" type="text" value="${esc(i.note)}" data-focus autocomplete="off"><div class="actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveNote" data-i="${el.dataset.i}">Save</button></div>`);break}
    case 'saveNote':{const i=cart.items[+el.dataset.i];i.note=$('#linenote').value.trim();closeModal();renderCart();break}
    case 'setType':cart.type=el.dataset.t;renderCart();break;
    case 'toggleCart':ui.cartOpen=!ui.cartOpen;$('#sellRoot').classList.toggle('cart-open',ui.cartOpen);break;
    case 'clearCart':if(cart.items.length&&ui.confirm!=='clear'){confirmTwice('clear','Tap again to clear',()=>{},el);break}cart=newCart();ui.confirm=null;renderGrid();renderCart();break;
    case 'discount':discountModal();break;
    case 'presetDisc':$('#dkind').value='pct';$('#dval').value=el.dataset.v;$('#dlabel').value=el.dataset.l;break;
    case 'applyDisc':{const v=num($('#dval').value);if(v<=0){toast('Enter a discount value');break}const kind=$('#dkind').value;cart.disc={kind,value:kind==='pct'?Math.min(100,v):v,label:$('#dlabel').value.trim()};closeModal();renderCart();break}
    case 'removeDisc':cart.disc=null;closeModal();renderCart();break;
    case 'hold':{db.held.push({id:uid(),ts:Date.now(),items:cart.items,type:cart.type,ref:cart.ref.trim(),disc:cart.disc,customerId:cart.customerId});cart=newCart();save();ui.cartOpen=false;render();toast('Order held');break}
    case 'showHeld':heldModal();break;
    case 'recallHeld':{const h=db.held.find(x=>x.id===id);if(!h)break;if(cart.items.length){toast('Hold or clear the current order first');break}cart={items:h.items,type:h.type,ref:h.ref||'',disc:h.disc,customerId:h.customerId,redeem:0};db.held=db.held.filter(x=>x.id!==id);save();closeModal();render();break}
    case 'deleteHeld':db.held=db.held.filter(x=>x.id!==id);save();heldModal();render();if(!$('#modal').hidden){}break;
    case 'pickCustomer':ui.cq='';customerModal();break;
    case 'selectCustomer':cart.customerId=id;cart.redeem=0;closeModal();renderCart();break;
    case 'clearCustomer':cart.customerId=null;cart.redeem=0;renderCart();break;
    case 'toggleRedeem':{const cu=cust(cart.customerId);cart.redeem=cart.redeem>0?0:cu.points;renderCart();break}
    case 'newCustomer':customerForm(null,el.dataset.from);break;
    case 'editCustomer':customerForm(id,'page');break;
    case 'saveCustomer':{const name=$('#cf-name').value.trim();if(!name){toast('Enter a name');break}
      const data={name,phone:$('#cf-phone').value.trim(),email:$('#cf-email').value.trim(),points:Math.max(0,Math.round(num($('#cf-points').value))),note:$('#cf-note').value.trim()};
      let c;if(id){c=cust(id);Object.assign(c,data)}else{c={id:uid(),...data};db.customers.push(c)}
      if(el.dataset.from==='sell'){cart.customerId=c.id;cart.redeem=0}
      save();closeModal();render();toast('Customer saved');break}
    case 'deleteCustomer':if(ui.confirm!=='dc'){confirmTwice('dc','Tap again to delete',()=>{},el);break}db.customers=db.customers.filter(c=>c.id!==id);ui.confirm=null;save();closeModal();render();break;
    case 'charge':charge();break;
    case 'goShift':closeModal();ui.view='shift';ui.cartOpen=false;render();break;
    case 'payMethod':pay.method=el.dataset.m;document.querySelectorAll('.methods button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===pay.method));setPayAmount();$('#payAmt').focus();break;
    case 'quickAmt':$('#payAmt').value=el.dataset.v;updatePayUI();break;
    case 'removePay':pay.payments.splice(+el.dataset.i,1);setPayAmount();break;
    case 'payGo':payGo();break;
    case 'viewSale':receiptModal(id,false);break;
    case 'copyReceipt':copyText(receiptText(db.sales.find(s=>s.id===id)));break;
    case 'printReceipt':printText(receiptText(db.sales.find(x=>x.id===id)));break;
    case 'printZ':printText(zText(db.shifts.find(x=>x.id===id)));break;
    case 'printTest':{const W=paperChars(),s=db.settings,ctr=t=>' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t;printText([ctr(s.store),ctr('TEST RECEIPT'),'-'.repeat(W),'1234567890'.repeat(5).slice(0,W),'Paper: '+(s.paper==='58'?'58':'80')+' mm, '+W+' characters wide','-'.repeat(W),ctr('If every line above fits,'),ctr('the setup is correct.')].join('\n'));break}
    case 'saveReceipt':{const s=db.sales.find(x=>x.id===id);saveFile('receipt_'+s.no+'.txt',receiptText(s));break}
    case 'refund':refundModal(id);break;
    case 'deleteSale':deleteSaleModal(id);break;
    case 'confirmDeleteSale':doDeleteSale(id);break;
    case 'confirmRefund':doRefund(id,$('#rreason').value);break;
    case 'setODate':ui.odate=el.dataset.v;render();break;
    case 'newProduct':productModal(null);break;
    case 'editProduct':productModal(id);break;
    case 'saveProduct':saveProduct(id);break;
    case 'deleteProduct':if(ui.confirm!=='dp'){confirmTwice('dp','Tap again to delete',()=>{},el);break}db.products=db.products.filter(p=>p.id!==id);cart.items=cart.items.filter(i=>i.pid!==id);ui.confirm=null;save();closeModal();render();toast('Item deleted');break;
    case 'adjustStock':adjustModal(id);break;
    case 'saveAdjust':{const d=Math.round(num($('#sa-qty').value));if(!d){toast('Enter a quantity change');break}const p=prod(id);p.stock=Math.max(0,p.stock+d);db.stockLog.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,delta:d,reason:$('#sa-reason').value,by:cashierName()});save();closeModal();render();toast('Stock updated');break}
    case 'manageCats':catModal();break;
    case 'addCat':{const v=$('#newcat').value.trim();if(v&&!db.categories.includes(v)){db.categories.push(v);save()}catModal();break}
    case 'delCat':db.categories=db.categories.filter(c=>c!==el.dataset.c);if(ui.cat===el.dataset.c)ui.cat='All';save();catModal();break;
    case 'openShift':{const c=num($('#openCash').value);if(c<0){toast('Enter the opening cash');break}db.shifts.push({id:uid(),openTs:Date.now(),closeTs:null,cashier:cashierName(),openingCash:r2(c),entries:[],counted:null,expected:null,variance:null});save();render();toast('Shift opened');break}
    case 'cashEntry':{const t=el.dataset.t;modal(`<div class="dialog-head"><h2>${t==='in'?'Pay in':'Pay out'}</h2></div><div class="form2"><label class="f">Amount<input id="ce-amt" inputmode="decimal" data-focus></label><label class="f">Reason<input id="ce-why" type="text" placeholder="${t==='in'?'Extra change':'Supplies, milk run…'}" autocomplete="off"></label></div><div class="actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveEntry" data-t="${t}">Record</button></div>`);break}
    case 'saveEntry':{const amt=r2(num($('#ce-amt').value));if(amt<=0){toast('Enter an amount');break}openShift().entries.push({ts:Date.now(),type:el.dataset.t,amount:amt,reason:$('#ce-why').value.trim()});save();closeModal();render();break}
    case 'closeShift':{const sh=openShift(),st=shiftStats(sh);modal(`<div class="dialog-head"><h2>Close shift</h2></div><div class="kv num"><div class="tr"><span>Expected in drawer</span><strong>${money(st.expected)}</strong></div></div><label class="f">Counted cash<input id="cs-count" inputmode="decimal" data-in="countCash" data-focus></label><div class="paysum" id="csVar"><span>Over / short</span><span class="num">Enter the count</span></div><div class="actions"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="confirmClose">Close shift</button></div>`);break}
    case 'confirmClose':{const v=$('#cs-count').value.trim();if(v===''){toast('Enter the counted cash');break}const sh=openShift(),st=shiftStats(sh),c=r2(num(v));sh.closeTs=Date.now();sh.counted=c;sh.expected=st.expected;sh.variance=r2(c-st.expected);save();render();zModal(sh.id,'Shift closed');break}
    case 'viewZ':zModal(id);break;
    case 'deleteShift':deleteShiftModal(id);break;
    case 'confirmDeleteShift':doDeleteShift(id);break;
    case 'copyZ':copyText(zText(db.shifts.find(s=>s.id===id)));break;
    case 'saveZ':saveFile('shift_report_'+dayKey(db.shifts.find(s=>s.id===id).openTs)+'.txt',zText(db.shifts.find(s=>s.id===id)));break;
    case 'setRange':ui.rrange=el.dataset.v;if(ui.rrange==='custom'&&!ui.rfrom){ui.rto=dayKey(Date.now());ui.rfrom=dayKey(Date.now()-6*DAY)}render();break;
    case 'exportSales':exportSales();break;
    case 'exportLines':exportLines();break;
    case 'exportProducts':exportProducts();break;
    case 'saveSettings':{const s=db.settings;s.store=$('#st-store').value.trim()||'My Shop';s.address=$('#st-address').value.trim();s.phone=$('#st-phone').value.trim();s.currency=$('#st-currency').value.trim()||'₱';s.footer=$('#st-footer').value.trim();s.taxName=$('#st-taxName').value.trim()||'Tax';s.taxRate=Math.max(0,num($('#st-taxRate').value));s.taxInclusive=$('#st-taxInc').checked;s.loyaltyEvery=Math.max(0,num($('#st-loyEvery').value));s.lockMinutes=Math.max(0,Math.round(num($('#st-lock').value)));s.paper=$('#st-paper').value==='58'?'58':'80';s.autoPrint=$('#st-autoPrint').value==='1';resetIdle();s.pointValue=Math.max(0.01,num($('#st-ptVal').value)||1);save();render();toast('Settings saved');break}
    case 'backup':saveFile('pos_backup_'+dayKey(Date.now())+'.json',JSON.stringify(db));break;
    case 'restore':$('#impFile').click();break;
    case 'loadDemo':if(ui.confirm!=='demo'){confirmTwice('demo','Tap again to replace all data',()=>{},el);break}ui.confirm=null;{const keep=db.staff,bg=['bgImage','bgDim','bgPanel'].map(k=>db.settings[k]);db=normalize(demoData());db.staff=keep;['bgImage','bgDim','bgPanel'].forEach((k,i)=>db.settings[k]=bg[i]);db.settings.cashier=ui.user}cart=newCart();save();render();toast('Sample data loaded');break;
    case 'wipe':if(ui.confirm!=='wipe'){confirmTwice('wipe','Tap again to erase everything',()=>{},el);break}ui.confirm=null;{const keep=db.staff,bg=['bgImage','bgDim','bgPanel'].map(k=>db.settings[k]);db=normalize(blankDb());db.staff=keep;['bgImage','bgDim','bgPanel'].forEach((k,i)=>db.settings[k]=bg[i]);db.settings.cashier=ui.user}cart=newCart();ui.cat='All';save();render();toast('Everything erased. Add your items to begin.');break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  switch(k){
    case 'bgDim':case 'bgPanel':{if(!isAdmin())break;db.settings[k]=+el.value;applyBackground();const lab=el.parentElement.firstChild;lab.textContent=(k==='bgDim'?'Dim the image (':'Panel solidity (')+el.value+'%)';break}
    case 'q':ui.q=el.value;renderGrid();break;
    case 'ref':cart.ref=el.value;break;
    case 'payAmt':updatePayUI();break;
    case 'oq':ui.oq=el.value;{const pos=el.selectionStart;render();const n=$('#oq');n.focus();n.setSelectionRange(pos,pos)}break;
    case 'pq':ui.pq=el.value;{const pos=el.selectionStart;render();const n=$('#pq');n.focus();n.setSelectionRange(pos,pos)}break;
    case 'cq2':ui.cq=el.value;{const pos=el.selectionStart;render();const n=$('#cq2');n.focus();n.setSelectionRange(pos,pos)}break;
    case 'custq':{ui.cq=el.value;const q=ui.cq.toLowerCase();$('#custlist').innerHTML=custListHtml(db.customers.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)).slice(0,30));break}
    case 'countCash':{const sh=openShift(),st=shiftStats(sh),v=el.value.trim(),box=$('#csVar');if(v===''){box.className='paysum';box.innerHTML='<span>Over / short</span><span class="num">Enter the count</span>';break}const d=r2(num(v)-st.expected);box.className='paysum '+(d===0?'ok':'short');box.innerHTML='<span>Over / short</span><span class="num">'+(d>0?'+':'')+money(d)+'</span>';break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset&&el.dataset.in;
  if(k==='cashier'){db.settings.cashier=el.value;save();render();return}
  if(k==='ostatus'){ui.ostatus=el.value;render()}
  if(k==='pcat'){ui.pcat=el.value;render()}
  if(k==='pstock'){ui.pstock=el.value;render()}
  if(k==='rfrom'){ui.rfrom=el.value;render()}
  if(k==='rto'){ui.rto=el.value;render()}
  if(k==='bgDim'||k==='bgPanel'){if(isAdmin())save()}
  if(el.id==='bgFile'&&el.files[0]&&isAdmin()){
    const f=el.files[0];el.value='';
    if(!/^image\//.test(f.type)){toast('Choose an image file');return}
    shrinkImage(f).then(d=>{db.settings.bgImage=d;save();if(!storageOk)toast('The image is too large for this browser to keep. Try a smaller one.');else toast('Background set');render()}).catch(()=>toast('That image could not be read'));
    return;
  }
  if(el.id==='impFile'&&el.files[0]&&isAdmin()){
    const f=el.files[0],fr=new FileReader();
    fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.products)||!Array.isArray(d.sales))throw new Error('bad');db=normalize(d);cart=newCart();ui.user=null;save();render();toast('Backup restored. Sign in with the accounts from that backup.')}catch(err){toast('That file is not a valid backup')}};
    fr.readAsText(f);el.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  if(e.key==='Enter'){
    const t=e.target;
    if(t.id==='lg-user'||t.id==='lg-pass'){e.preventDefault();doLogin();return}
    if(t.id==='su-pass2'){e.preventDefault();doSetup();return}
    if(t.id==='payAmt'){e.preventDefault();const g=$('#payGo');if(g&&!g.disabled)payGo()}
    else if(t.id==='q'){
      const list=visibleProducts();const q=ui.q.trim().toLowerCase();
      const exact=list.find(p=>p.sku&&p.sku.toLowerCase()===q);
      const pick=exact||(list.length===1?list[0]:null);
      if(pick){addProduct(pick.id);ui.q='';t.value='';renderGrid()}
    }
  }
});

/* ============================ boot ============================ */
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOk=false}
db=loadDb();
if(!db)db=blankDb();
db=normalize(db);
render();
</script>

</body></html>
